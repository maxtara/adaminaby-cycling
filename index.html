const panel = document.getElementById('panel');

let active = null;

// ---- elevation profile: DAYS[i].prof = [[km, ele, lat, lon], ...]
const prof = document.getElementById('prof');
const info = document.getElementById('profinfo');
const HINT = 'Move along the profile to see where you are';
const spot = L.circleMarker([0, 0], { radius: 7, color: '#000', weight: 2, fillColor: '#ffeb3b', fillOpacity: 1, interactive: false });
let geom = null;

function drawProfile() {
  const W = prof.clientWidth || 300, H = 110, pl = 34, pr = 6, pt = 12, pb = 16;
  let off = 0;
  const S = [];
  DAYS.forEach((d, i) => {
    if (active === null || active === i) S.push({ d, pts: d.prof.map(p => [p[0] + (active === null ? off : 0), p[1], p[2], p[3], p[0]]) });
    off += d.km;
  });
  const all = S.flatMap(s => s.pts), x0 = all[0][0], x1 = all[all.length - 1][0];
  const lo = Math.floor(Math.min(...all.map(p => p[1])) / 50) * 50, hi = Math.ceil(Math.max(...all.map(p => p[1])) / 50) * 50;
  const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr), Y = e => pt + (hi - e) / (hi - lo) * (H - pt - pb);
  let svg = '';
  for (let e = Math.ceil(lo / 100) * 100; e <= hi; e += 100)
    svg += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(e)}" y2="${Y(e)}"/><text class="ylab" x="${pl - 4}" y="${Y(e) + 3}">${e}</text>`;
  const step = x1 - x0 > 40 ? 10 : 5;
  for (let k = Math.ceil(x0 / step) * step; k <= x1 + 0.01; k += step) svg += `<text class="xlab" x="${X(k)}" y="${H - 3}">${k}</text>`;
  S.forEach(s => {
    const pts = s.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    const a = X(s.pts[0][0]).toFixed(1), b = X(s.pts[s.pts.length - 1][0]).toFixed(1);
    svg += `<polygon points="${a},${Y(lo)} ${pts} ${b},${Y(lo)}" fill="${s.d.color}" fill-opacity="0.18"/>` +
      `<polyline points="${pts}" fill="none" stroke="${s.d.color}" stroke-width="1.8"/>`;
    if (active === null) svg += `<text class="dlab" x="${(+a + 3).toFixed(1)}" y="${pt - 2}">${esc(s.d.title)}</text>`;
  });
  svg += `<line id="pcur" y1="${pt}" y2="${H - pb}" stroke="#000" stroke-width="1" visibility="hidden"/>`;
  prof.setAttribute('viewBox', `0 0 ${W} ${H}`);
  prof.innerHTML = svg;
  geom = { S, X, x0, x1, pl, pr, W };
  info.textContent = HINT;
  spot.remove();
}

function hover(ev) {
  if (!geom) return;
  const r = prof.getBoundingClientRect();
  const x = geom.x0 + (ev.clientX - r.left - geom.pl) / (geom.W - geom.pl - geom.pr) * (geom.x1 - geom.x0);
  let best = null;
  geom.S.forEach(s => s.pts.forEach(p => { const dd = Math.abs(p[0] - x); if (!best || dd < best.dd) best = { dd, p, s }; }));
  const cur = document.getElementById('pcur');
  cur.setAttribute('x1', geom.X(best.p[0])); cur.setAttribute('x2', geom.X(best.p[0])); cur.setAttribute('visibility', 'visible');
  spot.setLatLng([best.p[2], best.p[3]]).addTo(map);
  info.textContent = `${best.s.d.title} · km ${best.p[4].toFixed(1)} · ${best.p[1]} m`;
}
prof.addEventListener('pointermove', hover);
prof.addEventListener('pointerdown', hover);
prof.addEventListener('pointerleave', ev => {
  if (ev.pointerType !== 'mouse') return;
  spot.remove();
  document.getElementById('pcur').setAttribute('visibility', 'hidden');
  info.textContent = HINT;
});
window.addEventListener('resize', drawProfile);

function fit(bounds) {
  const box = panel.getBoundingClientRect(), mobile = window.innerWidth <= 600;
  map.fitBounds(bounds, { paddingTopLeft: [50, 30], paddingBottomRight: mobile ? [20, box.height + 20] : [box.width + 30, 30] });
}

function select(i) {
  active = i;
  routes.forEach((r, j) => {
    const on = active === null || active === j;
    r.line.setStyle({ opacity: on ? 0.95 : 0.3 });
    r.casing.setStyle({ opacity: on ? 0.9 : 0.2 });
    if (on) r.group.bringToFront();
  });
  [...list.children].forEach((el, j) => el.classList.toggle('active', j === active));
  drawProfile();
  fit(active === null ? allBounds : routes[active].group.getBounds());
}

DAYS.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'day';
  el.innerHTML = `<span class="bar" style="background:${d.color}"></span><div><b>${esc(d.title)}</b> · ${esc(d.from)} → ${esc(d.to)}` +
    `<div class="stats">${statsLine(d)}<br>${esc(d.surface)}</div><a href="${esc(d.gpx)}" download>GPX</a></div>`;
  el.addEventListener('click', e => { if (e.target.tagName !== 'A') select(active === i ? null : i); });
  list.appendChild(el);
});

document.getElementById('head').addEventListener('click', e => {
  if (e.target.tagName === 'A') return;
  if (window.innerWidth <= 600) panel.classList.toggle('collapsed');
  select(null);
});

select(null);
</script>
</body>
</html>
