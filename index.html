const PLACES = [{"id":"start","name":"Start: Old Boboyan Rd","kind":"start","icon":"🚩","lat":-35.740152,"lon":148.996248,"when":"Day 1 start","note":"Gudgenby valley, Rendezvous Creek area. Same start as the Komoot route, about 400 m in from Boboyan Rd.","link":"https://www.parks.act.gov.au/__data/assets/pdf_file/0012/518988/namadgi-national-park-a-brief-guide.pdf","linkLabel":"Namadgi park guide (PDF)"},{"id":"junction","name":"Leave Old Boboyan Rd","kind":"poi","icon":"↱","lat":-35.865098,"lon":148.992996,"when":"Day 1 · km 18","note":"The fire trail meets Boboyan Rd here. Follow Boboyan Rd about 1 km towards Mount Clear, then Mount Clear Campground Rd for about 0.9 km.","link":null,"linkLabel":null},{"id":"mountclear","name":"Mount Clear Campground","kind":"night","icon":"⛺","lat":-35.864906,"lon":149.010926,"when":"Nights 1 & 2","note":"Namadgi National Park (ACT). The Day 2 loop starts and finishes here.","link":"https://www.parks.act.gov.au/__data/assets/pdf_file/0012/518988/namadgi-national-park-a-brief-guide.pdf","linkLabel":"Namadgi park guide (PDF)"},{"id":"lutons","name":"Lutons Crutching Shed","kind":"poi","icon":"🏚","lat":-35.826707,"lon":148.946187,"when":"Day 2 · km 9","note":"Old shearing shed at the end of a short out-and-back on Sams Creek Fire Trail. Crawford Homestead ruins are about 200 m away.","link":null,"linkLabel":null},{"id":"waterhole","name":"Waterhole Hut","kind":"poi","icon":"🏚","lat":-35.866481,"lon":148.951953,"when":"Day 2 · km 15","note":"Historic hut beside the Waterholes Fire Trail.","link":null,"linkLabel":null},{"id":"westermans","name":"Westermans Hut","kind":"poi","icon":"🏚","lat":-35.887154,"lon":148.971501,"when":"Day 2 · km 18","note":"Historic hut on the Grassy Creek Fire Trail.","link":null,"linkLabel":null},{"id":"brayshaw","name":"David Brayshaws Hut","kind":"poi","icon":"🏚","lat":-35.874688,"lon":148.984891,"when":"Day 2 · km 22 · Day 3 · km 3","note":"Historic hut right beside Boboyan Rd. Toilets.","link":null,"linkLabel":null},{"id":"border","name":"ACT / NSW border","kind":"poi","icon":"➜","lat":-35.922404,"lon":148.949638,"when":"Day 3 · km 10","note":"Boboyan Rd becomes Bobeyan Rd here.","link":null,"linkLabel":null},{"id":"trout","name":"The Big Trout","kind":"poi","icon":"🐟","lat":-35.99733,"lon":148.77461,"when":"Day 3 · km 35","note":"Adaminaby's giant trout.","link":null,"linkLabel":null},{"id":"atp","name":"Alpine Tourist Park, Adaminaby","kind":"night","icon":"🏕","lat":-35.99579,"lon":148.769425,"when":"Night 3 · end of Day 3","note":"","link":"https://alpinetouristpark.com.au/","linkLabel":null},{"id":"oldada","name":"Old Adaminaby","kind":"poi","icon":"🏘","lat":-36.04048,"lon":148.70302,"when":"Day 4 · km 9","note":"The original town, mostly relocated in the 1950s when Lake Eucumbene was filled. A short out-and-back off Anglers Reach Rd.","link":null,"linkLabel":null},{"id":"finish","name":"Anglers Reach Caravan Park","kind":"finish","icon":"🏁","lat":-35.997584,"lon":148.662005,"when":"Night 4 · end of Day 4","note":"Lake Eucumbene.","link":"https://anglersreach.com/","linkLabel":null}];

const map = L.map('map', { maxZoom: 19, zoomSnap: 0.25 });
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxNativeZoom: 17, maxZoom: 19,
  attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)' });
const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19,
  attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics | Routes &copy; OpenStreetMap contributors' });
street.addTo(map);
L.control.layers({ 'Street': street, 'Topo': topo, 'Satellite': sat }, null, { position: 'topleft' }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const statsLine = d => `${d.km} km`;
const routeName = d => esc(d.from) + (d.to ? ` → ${esc(d.to)}` : '');

const routes = DAYS.map(d => {
  const casing = L.polyline(d.line, { color: '#fff', weight: 8, opacity: 0.9, interactive: false });
  const line = L.polyline(d.line, { color: d.color, weight: 5, opacity: 0.95 }).bindPopup(
    `<h3>${esc(d.title)}: ${routeName(d)}</h3><div>${statsLine(d)}</div>` +
    `<div class="when">${esc(d.surface)}</div><a href="${esc(d.gpx)}" download>Download GPX</a>`);
  return { casing, line, group: L.featureGroup([casing, line]).addTo(map) };
});

PLACES.forEach(p => {
  const poi = p.kind === 'poi', size = poi ? 22 : 28;
  const icon = L.divIcon({ className: '', html: `<div class="pin${poi ? ' poi' : ''}">${p.icon}</div>`,
    iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
  const gmaps = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
  L.marker([p.lat, p.lon], { icon, title: p.name, zIndexOffset: poi ? 0 : 1000 }).bindPopup(
    `<h3>${esc(p.name)}</h3><div class="when">${esc(p.when)}</div>` + (p.note ? `<div>${esc(p.note)}</div>` : '') +
    `<div style="margin-top:6px"><a href="${gmaps}" target="_blank" rel="noopener">Open in Google Maps</a>` +
    (p.link ? ` · <a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkLabel || 'Website')}</a>` : '') + '</div>').addTo(map);
});

const panel = document.getElementById('panel');
const list = document.getElementById('days');
const allBounds = L.featureGroup(routes.map(r => r.group)).getBounds();
let active = null;

function fit(bounds) {
  const box = panel.getBoundingClientRect(), mobile = window.innerWidth <= 600;
  map.fitBounds(bounds, { paddingTopLeft: [50, 30], paddingBottomRight: mobile ? [20, box.height + 20] : [box.width + 30, 30] });
}

function select(i) {
  active = i;
  routes.forEach((r, j) => {
    const on = active === null || active === j;
    r.line.setStyle({ opacity: on ? 0.95 : 0.3 });
    r.casing.setStyle({ opacity: on ? 0.9 : 0.2 });
    if (on) r.group.bringToFront();
  });
  [...list.children].forEach((el, j) => el.classList.toggle('active', j === active));
  fit(active === null ? allBounds : routes[active].group.getBounds());
}

DAYS.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'day';
  el.innerHTML = `<span class="bar" style="background:${d.color}"></span><div><b>${esc(d.title)}</b> · ${routeName(d)}` +
    `<div class="stats">${statsLine(d)} · ${esc(d.surface)}</div><a href="${esc(d.gpx)}" download>GPX</a></div>`;
  el.addEventListener('click', e => { if (e.target.tagName !== 'A') select(active === i ? null : i); });
  list.appendChild(el);
});

document.getElementById('head').addEventListener('click', e => {
  if (e.target.tagName === 'A') return;
  if (window.innerWidth <= 600) panel.classList.toggle('collapsed');
  select(null);
});

select(null);
</script>
